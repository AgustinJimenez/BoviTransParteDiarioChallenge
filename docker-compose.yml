services:
  db:
    image: postgres:15-alpine
    container_name: bovitrans_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bovitrans}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bovitrans_pass}
      POSTGRES_DB: ${POSTGRES_DB:-bovitrans}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bovitrans} -d ${POSTGRES_DB:-bovitrans}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - bovitrans_network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bovitrans_app
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-bovitrans}:${POSTGRES_PASSWORD:-bovitrans_pass}@db:5432/${POSTGRES_DB:-bovitrans}?schema=public
      NODE_ENV: production
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - bovitrans_network

volumes:
  postgres_data:
    driver: local

networks:
  bovitrans_network:
    driver: bridge
